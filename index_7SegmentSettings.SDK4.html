<!DOCTYPE html>
<!--
  Pagina di configurazione 7 Segment - Versione pagina: 2.1.0
  Redesign moderno, autonomo (nessuna dipendenza esterna), responsive,
  con tema chiaro/scuro automatico.

  Compatibilità: mantiene invariati i parametri in ingresso (status,
  background, language, format, weastatus, weaunit, weanotif,
  backgroundcolor, textcolor, appstatus, watchdesc, return_to) e le chiavi
  JSON restituite, oltre alla codifica colore GColor a 8 bit di Pebble.
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>7 Segment</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e2e2e7;
      --accent: #ff7a00;
      --accent-text: #ffffff;
      --segment-bg: #ececed;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #ffffff;
        --muted: #98989f;
        --border: #2c2c2e;
        --segment-bg: #2c2c2e;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 96px;
      line-height: 1.4;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--accent);
      color: var(--accent-text);
      padding: calc(env(safe-area-inset-top) + 18px) 16px 18px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: .9; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .row .label { font-size: 15px; font-weight: 600; }
    .row .hint { font-size: 12px; color: var(--muted); }

    select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 12px 40px 12px 14px;
      font-size: 16px;
      color: var(--text);
      background: var(--segment-bg);
      border: none;
      border-radius: 10px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }

    .segment {
      display: flex;
      background: var(--segment-bg);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }
    .segment button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 9px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .segment button.selected {
      background: var(--accent);
      color: var(--accent-text);
    }

    .swatch-grid {
      display: none;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .swatch-grid.open { display: grid; }
    .swatch {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
    }
    .swatch.selected {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
    }
    .color-preview {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .color-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .color-head .right { display: flex; align-items: center; gap: 10px; }
    .caret {
      color: var(--muted);
      font-size: 12px;
      transition: transform .15s;
    }
    .caret.open { transform: rotate(180deg); }

    .footer-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
      display: flex;
      gap: 12px;
      max-width: 560px;
      margin: 0 auto;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-cancel { background: var(--segment-bg); color: var(--text); }
    .btn-submit { background: var(--accent); color: var(--accent-text); }

    .credit { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0 8px; }
  </style>
</head>
<body>
  <header>
    <h1>7 SEGMENT</h1>
    <p>Impostazioni</p>
  </header>

  <div class="wrap">
    <div class="card">
      <!-- Bluetooth -->
      <div class="row">
        <span class="label">Avviso Bluetooth</span>
        <div class="segment" id="status" data-value="1">
          <button data-val="0">Off</button>
          <button data-val="1">On</button>
          <button data-val="2">On + Inverti</button>
        </div>
        <span class="hint">Il Pebble vibra brevemente quando si perde la connessione Bluetooth con il telefono.</span>
      </div>

      <!-- Lingua -->
      <div class="row">
        <span class="label">Lingua</span>
        <select id="language">
          <option value="4">Croato</option>
          <option value="12">Ceco</option>
          <option value="1">Olandese</option>
          <option value="0">Inglese</option>
          <option value="8">Finlandese</option>
          <option value="3">Francese</option>
          <option value="2">Tedesco</option>
          <option value="10">Greco</option>
          <option value="6">Italiano</option>
          <option value="7">Norvegese</option>
          <option value="11">Russo</option>
          <option value="5">Spagnolo</option>
          <option value="9">Turco</option>
        </select>
      </div>

      <!-- Formato data -->
      <div class="row">
        <span class="label">Formato data</span>
        <div class="segment" id="format" data-value="0">
          <button data-val="0">GG-MM</button>
          <button data-val="1">MM-GG</button>
        </div>
      </div>

      <!-- Sfondo -->
      <div class="row">
        <span class="label">Colori watchface</span>
        <div class="segment" id="background" data-value="0">
          <button data-val="0">Normale</button>
          <button data-val="1">Invertito</button>
        </div>
      </div>
    </div>

    <div class="card">
      <!-- Meteo -->
      <div class="row">
        <span class="label">Meteo</span>
        <select id="weastatus">
          <option value="0">Off</option>
          <option value="10">Ogni 10 min</option>
          <option value="30">Ogni 30 min</option>
          <option value="60">Ogni ora</option>
          <option value="120">Ogni 2 ore</option>
          <option value="240">Ogni 4 ore</option>
          <option value="360">Ogni 6 ore</option>
        </select>
      </div>
      <div class="row">
        <span class="label">Unità</span>
        <div class="segment" id="weaunit" data-value="0">
          <button data-val="0">&deg;C</button>
          <button data-val="1">&deg;F</button>
        </div>
      </div>
      <div class="row">
        <span class="label">Notifica meteo</span>
        <div class="segment" id="weanotif" data-value="0">
          <button data-val="0">Off</button>
          <button data-val="1">On</button>
        </div>
      </div>
    </div>

    <!-- Colori (solo piattaforme a colori) -->
    <div class="card" id="color_section">
      <div class="row">
        <div class="color-head" id="bkg-head">
          <span class="label">Colore sfondo</span>
          <span class="right">
            <span class="color-preview" id="bkg-preview"></span>
            <span class="caret" id="bkg-caret">&#9662;</span>
          </span>
        </div>
        <div class="swatch-grid" id="bkg-grid"></div>
      </div>
      <div class="row">
        <div class="color-head" id="text-head">
          <span class="label">Colore testo</span>
          <span class="right">
            <span class="color-preview" id="text-preview"></span>
            <span class="caret" id="text-caret">&#9662;</span>
          </span>
        </div>
        <div class="swatch-grid" id="text-grid"></div>
      </div>
    </div>

    <div class="credit" id="credit"></div>
  </div>

  <div class="footer-bar">
    <button class="btn btn-cancel" id="b-cancel">Annulla</button>
    <button class="btn btn-submit" id="b-submit">Salva</button>
  </div>

  <script>
    // ---- Utilità parametri URL ----
    function getQueryParam(name, def) {
      var query = location.search.substring(1);
      var pairs = query.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var kv = pairs[i].split('=');
        if (kv[0] === name) { return decodeURIComponent(kv[1]); }
      }
      return def;
    }

    // ---- Conversione colore Pebble GColor (8 bit: AA RR GG BB, 2 bit ciascuno) ----
    var LEVELS = [0, 85, 170, 255];
    function gcolorToHex(v) {
      v = parseInt(v, 10);
      var r = LEVELS[(v >> 4) & 3], g = LEVELS[(v >> 2) & 3], b = LEVELS[v & 3];
      return '#' + [r, g, b].map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }
    function hexToGColor(hex) {
      hex = hex.replace('#', '');
      var r = Math.round(parseInt(hex.substr(0, 2), 16) / 85);
      var g = Math.round(parseInt(hex.substr(2, 2), 16) / 85);
      var b = Math.round(parseInt(hex.substr(4, 2), 16) / 85);
      return 192 | (r << 4) | (g << 2) | b; // alpha sempre opaco (3)
    }

    // ---- Controlli segmentati ----
    function setupSegment(id, value) {
      var seg = document.getElementById(id);
      seg.dataset.value = String(value);
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (btn) {
        btn.classList.toggle('selected', btn.dataset.val === String(value));
        btn.addEventListener('click', function () {
          seg.dataset.value = btn.dataset.val;
          Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
            b.classList.remove('selected');
          });
          btn.classList.add('selected');
        });
      });
    }
    function segValue(id) { return parseInt(document.getElementById(id).dataset.value, 10); }

    // ---- Griglia colori (64 colori Pebble) ----
    var state = { bkg: 192, text: 255 };
    function buildPalette(gridId, previewId, key) {
      var grid = document.getElementById(gridId);
      var preview = document.getElementById(previewId);
      function refresh() { preview.style.background = gcolorToHex(state[key]); }
      LEVELS.forEach(function (r) {
        LEVELS.forEach(function (g) {
          LEVELS.forEach(function (b) {
            var val = 192 | ((r / 85) << 4) | ((g / 85) << 2) | (b / 85);
            var hex = '#' + [r, g, b].map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
            var sw = document.createElement('div');
            sw.className = 'swatch';
            sw.style.background = hex;
            sw.dataset.val = val;
            if (val === state[key]) { sw.classList.add('selected'); }
            sw.addEventListener('click', function () {
              state[key] = val;
              Array.prototype.forEach.call(grid.querySelectorAll('.swatch'), function (s) {
                s.classList.remove('selected');
              });
              sw.classList.add('selected');
              refresh();
              // Scelto il colore, richiude la tavolozza.
              grid.classList.remove('open');
              var caret = document.getElementById(key + '-caret');
              if (caret) { caret.classList.remove('open'); }
            });
            grid.appendChild(sw);
          });
        });
      });
      refresh();
    }

    // ---- Costruzione opzioni in uscita ----
    function saveOptions() {
      return {
        status: segValue('status'),
        background: segValue('background'),
        language: parseInt(document.getElementById('language').value, 10),
        format: segValue('format'),
        weastatus: parseInt(document.getElementById('weastatus').value, 10),
        weaunit: segValue('weaunit'),
        weanotif: segValue('weanotif'),
        backgroundcolor: state.bkg,
        textcolor: state.text
      };
    }

    // ---- Inizializzazione ----
    (function init() {
      setupSegment('status', getQueryParam('status', '1'));
      setupSegment('format', getQueryParam('format', '0'));
      setupSegment('background', getQueryParam('background', '0'));
      setupSegment('weaunit', getQueryParam('weaunit', '0'));
      setupSegment('weanotif', getQueryParam('weanotif', '0'));

      document.getElementById('language').value = getQueryParam('language', '0');
      document.getElementById('weastatus').value = getQueryParam('weastatus', '30');

      state.bkg = parseInt(getQueryParam('backgroundcolor', '192'), 10);
      state.text = parseInt(getQueryParam('textcolor', '255'), 10);

      // La sezione colori è disponibile solo sulle piattaforme a colori (appstatus >= 3).
      var appstatus = parseInt(getQueryParam('appstatus', '0'), 10);
      if (appstatus < 3) {
        document.getElementById('color_section').style.display = 'none';
      } else {
        buildPalette('bkg-grid', 'bkg-preview', 'bkg');
        buildPalette('text-grid', 'text-preview', 'text');

        // Click sull'intestazione: apre/chiude la relativa tavolozza.
        function toggleGrid(key) {
          var grid = document.getElementById(key + '-grid');
          var caret = document.getElementById(key + '-caret');
          var willOpen = !grid.classList.contains('open');
          // Chiude entrambe, poi apre eventualmente quella richiesta.
          ['bkg', 'text'].forEach(function (k) {
            document.getElementById(k + '-grid').classList.remove('open');
            document.getElementById(k + '-caret').classList.remove('open');
          });
          if (willOpen) {
            grid.classList.add('open');
            caret.classList.add('open');
          }
        }
        document.getElementById('bkg-head').addEventListener('click', function () { toggleGrid('bkg'); });
        document.getElementById('text-head').addEventListener('click', function () { toggleGrid('text'); });
      }

      document.getElementById('credit').textContent =
        '7 Segment by Crios Lab on: ' + getQueryParam('watchdesc', 'unknown');

      document.getElementById('b-cancel').addEventListener('click', function () {
        document.location = 'pebblejs://close#';
      });
      document.getElementById('b-submit').addEventListener('click', function () {
        var returnTo = getQueryParam('return_to', 'pebblejs://close#');
        document.location.href = returnTo + encodeURIComponent(JSON.stringify(saveOptions()));
      });
    })();
  </script>
</body>
</html>
