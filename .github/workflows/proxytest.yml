name: proxy-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        run: |
          F="https://romamobilita.it/sites/default/files/rome_rtgtfs_trip_updates_feed.pb"
          echo "RESULT_ ---- redirect chain direct (Origin header)"
          curl -sIL -m 30 -H 'Origin: https://criogenic.github.io' "$F" | grep -iE '^(HTTP|location|access-control|content-type|content-length)' | tr -d '\r' | sed 's/^/RESULT_ /'
          echo "RESULT_ ---- direct with browser UA"
          curl -sIL -m 30 -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36' -H 'Origin: https://criogenic.github.io' "$F" | grep -iE '^(HTTP|location|access-control|content-type|content-length)' | tr -d '\r' | sed 's/^/RESULT_ /'
          echo "RESULT_ ---- corsproxy body"
          curl -s -m 30 -H 'Origin: https://criogenic.github.io' -H 'Referer: https://criogenic.github.io/' "https://corsproxy.io/?url=$F" | head -c 300 | sed 's/^/RESULT_ /'; echo
          echo "RESULT_ ---- cors.eu.org"
          curl -s -D - -o /tmp/c.pb -m 30 -H 'Origin: https://criogenic.github.io' "https://cors.eu.org/$F" | grep -iE '^(HTTP|retry|x-rate|access-control|content-length)' | tr -d '\r' | sed 's/^/RESULT_ /'
          head -c 300 /tmp/c.pb | tr -c '[:print:]' '.' | sed 's/^/RESULT_ body: /'; echo
      - name: Browser console
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=0 --virtual-time-budget=45000 --dump-dom "https://criogenic.github.io/7segment/Atac708_gtfs.html?nocache=$(date +%s)" 2>err.txt >/dev/null || true
          grep -iE 'CONSOLE|cors|proxy' err.txt | head -20 | cut -c1-400 | sed 's/^/RESULT_ /'
