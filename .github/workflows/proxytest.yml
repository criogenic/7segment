name: proxy-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test proxies with new feed URL
        run: |
          FEED="https://romamobilita.it/wp-content/uploads/shared/rome_rtgtfs_trip_updates_feed.pb"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$FEED")
          for P in "diretto|$FEED" "cors.eu.org|https://cors.eu.org/$FEED" "corsfix|https://proxy.corsfix.com/?$FEED" "cors.lol|https://api.cors.lol/?url=$ENC" "everyorigin|https://everyorigin.jwvbremen.nl/api/get?url=$ENC" "whateverorigin|https://whateverorigin.org/get?url=$ENC" "corsproxy.org|https://corsproxy.org/?$ENC" "htmldriven|https://cors-proxy.htmldriven.com/?url=$ENC" "cloudflare-cors-anywhere|https://test.cors.workers.dev/?$FEED" "crossorigin.me|https://crossorigin.me/$FEED" "allorigins|https://api.allorigins.win/raw?url=$ENC" "codetabs|https://api.codetabs.com/v1/proxy?quest=$FEED"; do
            N="${P%%|*}"; U="${P#*|}"
            rm -f /tmp/f.pb /tmp/h.txt; touch /tmp/f.pb /tmp/h.txt
            OUT=$(curl -s -o /tmp/f.pb -D /tmp/h.txt -w '%{http_code} size=%{size_download} t=%{time_total}' -m 25 -H 'Origin: https://criogenic.github.io' -H 'Referer: https://criogenic.github.io/' "$U" || echo "curl-fail")
            ACAO=$(grep -i '^access-control-allow-origin' /tmp/h.txt | tr -d '\r' | tail -1)
            FIRST=$(head -c 2 /tmp/f.pb | xxd -p)
            echo "RESULT_PROXY $N => $OUT first=$FIRST $ACAO"
          done
          echo "RESULT_ stop_ids in direct feed:"
          curl -s -m 25 "$FEED" -o /tmp/d.pb; grep -c -a "70978" /tmp/d.pb | sed 's/^/RESULT_ count70978=/'
